name: Creative End-to-End Development Production

# Deliberately manual. Canonical production, daily scheduling and upload stay off.
on:
  workflow_dispatch:
    inputs:
      brief:
        description: Original story direction (currently supported worlds are listed in creative_assets.json)
        required: true
        type: string
      initialize:
        description: Initialize the separate development ledger only if it does not exist
        type: boolean
        default: false
      script_source:
        description: Live AI needs a key; authored_demo tests production without claiming AI generation
        type: choice
        options: [live_ai, authored_demo]
        default: live_ai

permissions:
  contents: read
concurrency:
  group: creative-development-ledger
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      CREATIVE_BRIEF: ${{ inputs.brief }}
      INITIALIZE: ${{ inputs.initialize }}
      SCRIPT_SOURCE: ${{ inputs.script_source }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stop before expensive setup if credentials are missing
        run: python -c "import os; assert os.environ.get('SCRIPT_SOURCE') == 'authored_demo' or os.environ.get('OPENROUTER_API_KEY'), 'Missing OPENROUTER_API_KEY; no AI or render has started'"
      - name: Install lightweight dependencies and run integration safeguards
        run: |
          python -m pip install -r requirements-production.txt
          python -m unittest discover -s tests -p 'test_creative*.py' -v
      - name: Restore isolated development memory
        run: |
          if [ "$INITIALIZE" = true ]; then
            python tools/cloud_creative_store.py restore --initialize-if-missing
          else
            python tools/cloud_creative_store.py restore
          fi
      - name: Generate and reserve one model-authored script
        run: |
          if [ "$SCRIPT_SOURCE" = authored_demo ]; then
            echo "AUTHORSHIP: explicit authored demonstration, not a live AI writing test"
            python -m autonomy.creative_service plan --development --state artifacts/creative_cloud_state/ledger.sqlite3 --run-key "github-${GITHUB_RUN_ID}" --approved-example examples/creative/creative_kings_mercy
          else
            python -m autonomy.creative_service plan --development --state artifacts/creative_cloud_state/ledger.sqlite3 --run-key "github-${GITHUB_RUN_ID}" --brief "$CREATIVE_BRIEF"
          fi
      - name: Persist reservation before rendering
        id: reservation
        run: python tools/cloud_creative_store.py save
      - name: Install free local voices and Blender runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth ffmpeg espeak-ng libgl1 libegl1 libxrender1 libxi6 libxkbcommon0 libsm6 libxext6 libxfixes3 libxxf86vm1 libgl1-mesa-dri
          python -m pip install -r requirements-voice-cast.txt
          python tools/setup_voice_cast.py --settings config/voice_cast_local.json
          curl -fL --retry 3 --max-time 300 https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz -o blender.tar.xz
          echo "78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec  blender.tar.xz" | sha256sum --check --strict
          mkdir -p blender-app
          tar -xf blender.tar.xz -C blender-app --strip-components=1
      - name: Produce one complete sampled preview and verify it
        run: |
          xvfb-run -a python -m autonomy.creative_service produce --development --state artifacts/creative_cloud_state/ledger.sqlite3 --run-key "github-${GITHUB_RUN_ID}" --out "artifacts/creative_media/${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --blender "$GITHUB_WORKSPACE/blender-app/blender" --ffmpeg ffmpeg
      - name: Persist verified result or failure without losing the reservation
        if: always() && steps.reservation.outcome == 'success'
        run: python tools/cloud_creative_store.py save
      - name: Download development preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/creative_media/**/*.mp4
            artifacts/creative_media/**/*.json
            artifacts/creative_media/**/*.log
            artifacts/creative_media/**/*.blend
            artifacts/creative_media/**/*.srt
            artifacts/creative_cloud_state/recovery.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
